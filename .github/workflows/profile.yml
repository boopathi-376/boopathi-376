name: Update profile visuals

# Generates the stats cards, 3D contribution graph and contribution snake
# inside this repo, so the README never depends on a rate-limited public server.
on:
  schedule:
    - cron: "30 0 * * *"   # every day at 06:00 IST
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ---------- GitHub stats + top languages (light & dark) ----------
      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&title_color=8B1E2B&icon_color=8B1E2B&text_color=2B2B2B&bg_color=F4F4F2&ring_color=8B1E2B
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&title_color=E5535F&icon_color=E5535F&text_color=C9D1D9&bg_color=161B22&ring_color=E5535F
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&langs_count=6&title_color=8B1E2B&text_color=2B2B2B&bg_color=F4F4F2
          path: profile/langs-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&langs_count=6&title_color=E5535F&text_color=C9D1D9&bg_color=161B22
          path: profile/langs-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # ---------- 3D contribution calendar ----------
      - name: 3D contribution graph
        id: contrib3d
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        continue-on-error: true

      - name: 3D contribution graph (retry)
        if: steps.contrib3d.outcome == 'failure'
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        continue-on-error: true

      - name: Commit generated images
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile profile-3d-contrib
          if git commit -m "chore: refresh profile visuals"; then
            git push
          fi

      # ---------- Contribution snake (crimson) ----------
      - name: Contribution snake
        uses: Platane/snk@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8B1E2B&color_dots=#ECECEA,#E8C9CD,#C97A84,#A33C49,#8B1E2B
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E5535F

      - name: Publish snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        continue-on-error: true
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
