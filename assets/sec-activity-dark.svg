<svg xmlns="http://www.w3.org/2000/svg" width="880" height="92" viewBox="0 0 880 92"><style>
    .serif{font-family:Georgia, 'Cormorant Garamond', 'Times New Roman', serif} .sans{font-family:'Segoe UI', -apple-system, Helvetica, Arial, sans-serif} .mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
    .fade{animation:fade .7s ease both}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes pulse{0%,100%{opacity:.9}50%{opacity:.25}}
    @keyframes ring{0%{r:5;opacity:.7}100%{r:16;opacity:0}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    .ring{animation:ring 2s ease-out infinite}
    </style><circle cx="6" cy="26" r="4" fill="#E5535F"/><text x="18" y="30" class="sans" font-size="12" letter-spacing="3" fill="#8B949E">07&#160;&#160;ACTIVITY</text><rect x="2" y="40" width="28" height="1.5" fill="#E5535F"/><text x="2" y="76" class="serif" font-size="30" font-weight="700" fill="#F0F3F6">Commits, streaks and contributions</text></svg>