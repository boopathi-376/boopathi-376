<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170"><style>
    .serif{font-family:Georgia, 'Cormorant Garamond', 'Times New Roman', serif} .sans{font-family:'Segoe UI', -apple-system, Helvetica, Arial, sans-serif} .mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
    .fade{animation:fade .7s ease both}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes pulse{0%,100%{opacity:.9}50%{opacity:.25}}
    @keyframes ring{0%{r:5;opacity:.7}100%{r:16;opacity:0}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    .ring{animation:ring 2s ease-out infinite}
    </style><rect x="0.5" y="0.5" width="879" height="169" rx="14" fill="#F4F4F2" stroke="#DADAD7"/><line x1="110.0" y1="44" x2="770.0" y2="44" stroke="#DADAD7" stroke-dasharray="3 5"/><circle cx="110.0" cy="44" r="20" fill="#FFFFFF" stroke="#8B1E2B" stroke-width="1.5"/><text x="110.0" y="50" text-anchor="middle" class="serif" font-size="16" font-weight="700" fill="#8B1E2B">01</text><g class="fade" style="animation-delay:0.0s"><text x="110.0" y="96" text-anchor="middle" class="serif" font-size="21" font-weight="700" fill="#161616">Explore</text><text x="110.0" y="122" text-anchor="middle" class="sans" font-size="12.5" fill="#6B6B6B">Study how existing</text><text x="110.0" y="140" text-anchor="middle" class="sans" font-size="12.5" fill="#6B6B6B">systems solve it</text></g><circle cx="330.0" cy="44" r="20" fill="#FFFFFF" stroke="#8B1E2B" stroke-width="1.5"/><text x="330.0" y="50" text-anchor="middle" class="serif" font-size="16" font-weight="700" fill="#8B1E2B">02</text><g class="fade" style="animation-delay:0.25s"><text x="330.0" y="96" text-anchor="middle" class="serif" font-size="21" font-weight="700" fill="#161616">Compare</text><text x="330.0" y="122" text-anchor="middle" class="sans" font-size="12.5" fill="#6B6B6B">Sketch 2–3 designs,</text><text x="330.0" y="140" text-anchor="middle" class="sans" font-size="12.5" fill="#6B6B6B">weigh trade-offs</text></g><circle cx="550.0" cy="44" r="20" fill="#FFFFFF" stroke="#8B1E2B" stroke-width="1.5"/><text x="550.0" y="50" text-anchor="middle" class="serif" font-size="16" font-weight="700" fill="#8B1E2B">03</text><g class="fade" style="animation-delay:0.5s"><text x="550.0" y="96" text-anchor="middle" class="serif" font-size="21" font-weight="700" fill="#161616">Decide</text><text x="550.0" y="122" text-anchor="middle" class="sans" font-size="12.5" fill="#6B6B6B">Pick one, and</text><text x="550.0" y="140" text-anchor="middle" class="sans" font-size="12.5" fill="#6B6B6B">write down why</text></g><circle cx="770.0" cy="44" r="20" fill="#FFFFFF" stroke="#8B1E2B" stroke-width="1.5"/><text x="770.0" y="50" text-anchor="middle" class="serif" font-size="16" font-weight="700" fill="#8B1E2B">04</text><g class="fade" style="animation-delay:0.75s"><text x="770.0" y="96" text-anchor="middle" class="serif" font-size="21" font-weight="700" fill="#161616">Build</text><text x="770.0" y="122" text-anchor="middle" class="sans" font-size="12.5" fill="#6B6B6B">End to end, then</text><text x="770.0" y="140" text-anchor="middle" class="sans" font-size="12.5" fill="#6B6B6B">measure &amp; refine</text></g></svg>